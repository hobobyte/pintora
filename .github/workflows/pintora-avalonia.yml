name: Pintora Avalonia

on:
  push:
    branches: [ main ]
    tags: [ 'v0.0.1-alpha' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release tag matches app version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^[[:space:]]*<Version>\(.*\)<\/Version>[[:space:]]*$/\1/p' Pintora.Avalonia/Pintora.Avalonia.csproj | head -n 1)"
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/Pintora.Avalonia.Tests/Pintora.Avalonia.Tests.csproj

      - name: Build
        run: dotnet build Pintora.Avalonia/Pintora.Avalonia.csproj --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test tests/Pintora.Avalonia.Tests/Pintora.Avalonia.Tests.csproj --configuration Release --no-build --no-restore -p:BuildInParallel=false -m:1

  package:
    name: Package (${{ matrix.rid }})
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.0.1-alpha'
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read app version
        id: version
        shell: bash
        run: |
          app_version="$(sed -n 's/^[[:space:]]*<Version>\(.*\)<\/Version>[[:space:]]*$/\1/p' Pintora.Avalonia/Pintora.Avalonia.csproj | head -n 1)"
          echo "app-version=$app_version" >> "$GITHUB_OUTPUT"
          echo "msi-version=${app_version%%-*}" >> "$GITHUB_OUTPUT"
          echo "deb-version=${app_version/-/~}" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained app
        run: dotnet publish Pintora.Avalonia/Pintora.Avalonia.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output publish/${{ matrix.rid }}

      - name: Include licenses and release documentation
        shell: bash
        run: |
          cp license-mit.txt license-pdn.txt Pintora.Avalonia/README.md Pintora.Avalonia/RELEASE-NOTES-0.0.1-alpha.md publish/${{ matrix.rid }}/
          cp Pinta.Resources/icons/pinta-icons.md publish/${{ matrix.rid }}/THIRD-PARTY-NOTICES-icons.md

      - name: Archive portable app
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath Pintora-${{ matrix.rid }}.zip

      - name: Archive portable app
        if: startsWith(matrix.rid, 'linux-') || startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          tar -czf Pintora-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} .

      - name: Install WiX Toolset
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add WixToolset.UI.wixext/5.0.2

      - name: Build Windows MSI
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: >
          wix build installer/avalonia/Package.wxs
          -d PintoraVersion=${{ steps.version.outputs.msi-version }}
          -arch x64 -out Pintora-win-x64.msi

      - name: Download appimagetool
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Build Linux AppImage
        if: matrix.rid == 'linux-x64'
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
        run: bash scripts/make-pintora-appimage.sh publish/linux-x64 dist

      - name: Build Linux deb package
        if: matrix.rid == 'linux-x64'
        run: bash scripts/make-pintora-linux-deb.sh publish/linux-x64 '${{ steps.version.outputs.deb-version }}' dist

      - name: Bundle macOS app and DMG
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          app_dir="Pintora-${{ matrix.rid }}/Pintora.app/Contents"
          mkdir -p "$app_dir/MacOS" "$app_dir/Resources"
          cp -R "publish/${{ matrix.rid }}/." "$app_dir/MacOS/"
          cp installer/macos/pinta.icns "$app_dir/Resources/Pintora.icns"
          cat > "$app_dir/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Pintora</string>
            <key>CFBundleDisplayName</key><string>Pintora</string>
            <key>CFBundleIdentifier</key><string>org.pintora.editor</string>
            <key>CFBundleVersion</key><string>${{ steps.version.outputs.msi-version }}</string>
            <key>CFBundleShortVersionString</key><string>${{ steps.version.outputs.app-version }}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>Pintora.Avalonia</string>
            <key>CFBundleIconFile</key><string>Pintora.icns</string>
          </dict></plist>
          PLIST
          chmod +x "$app_dir/MacOS/Pintora.Avalonia"
          bash scripts/make-pintora-macos-dmg.sh "Pintora-${{ matrix.rid }}/Pintora.app" "Pintora-${{ matrix.rid }}.dmg"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pintora-${{ matrix.rid }}
          path: |
            Pintora-${{ matrix.rid }}.*
            dist/Pintora-*.AppImage
            dist/pintora_*.deb
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Create draft alpha release
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.0.1-alpha'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: Pintora-*
          path: release-assets
          merge-multiple: true

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Pintora ${{ github.ref_name }}
          body_path: Pintora.Avalonia/RELEASE-NOTES-0.0.1-alpha.md
          draft: true
          prerelease: true
          files: release-assets/*
          fail_on_unmatched_files: true
